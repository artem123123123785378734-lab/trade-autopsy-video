name: Render

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Public job id"
        required: true
        type: string
      payload:
        description: "Base64-encoded render payload"
        required: true
        type: string

run-name: Render ${{ inputs.job_id }}

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Configure FFmpeg
        run: |
          # imageio-ffmpeg ships a static binary with libx264. This avoids
          # apt mirrors that can hang on GitHub-hosted runners.
          FFMPEG_BIN="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          echo "FFMPEG=$FFMPEG_BIN" >> "$GITHUB_ENV"
          "$FFMPEG_BIN" -hide_banner -version | head -n 1

      - name: Install graphics libraries
        run: |
          # The runner image uses a mirrorlist that can point at an
          # unreachable Azure mirror. Replace it with the public archive.
          sudo rm -f /etc/apt/sources.list /etc/apt/sources.list.d/*
          sudo tee /etc/apt/sources.list >/dev/null <<'EOF'
          deb https://archive.ubuntu.com/ubuntu resolute main restricted universe multiverse
          deb https://archive.ubuntu.com/ubuntu resolute-updates main restricted universe multiverse
          deb https://archive.ubuntu.com/ubuntu resolute-backports main restricted universe multiverse
          deb https://archive.ubuntu.com/ubuntu resolute-security main restricted universe multiverse
          EOF
          timeout 180 sudo apt-get update -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          timeout 240 sudo apt-get install -y --no-install-recommends \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            libgl1 libglib2.0-0 libegl1 libgles2
          ldconfig -p | grep -E 'libGL\.so|libEGL\.so|libGLESv2\.so' || true

      - name: Verify Skia graphics libraries
        run: |
          python - <<'PY'
          import skia
          surface = skia.Surface(64, 64)
          surface.getCanvas().clear(skia.ColorBLACK)
          print("skia ok")
          PY

      - name: Install offline Piper voice
        run: |
          mkdir -p piper-runtime
          curl -L --fail --retry 3 -o /tmp/piper.tgz \
            https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
          tar -xzf /tmp/piper.tgz -C piper-runtime
          # Dmitri is a current CC0 voice. Denis is pinned to the last model
          # revision compatible with the bundled Piper 2023 runtime; the
          # retrained 2026-11-09 model crashes this binary.
          for voice in dmitri denis; do
            if [ "$voice" = "denis" ]; then
              rev="e7229f7d33a10e145e109b886d661984201ac3c4"
            else
              rev="main"
            fi
            curl -L --fail --retry 3 -o piper-runtime/ru_RU-${voice}-medium.onnx \
              https://huggingface.co/rhasspy/piper-voices/resolve/${rev}/ru/ru_RU/${voice}/medium/ru_RU-${voice}-medium.onnx
            curl -L --fail --retry 3 -o piper-runtime/ru_RU-${voice}-medium.onnx.json \
              https://huggingface.co/rhasspy/piper-voices/resolve/${rev}/ru/ru_RU/${voice}/medium/ru_RU-${voice}-medium.onnx.json
          done
          chmod +x piper-runtime/piper/piper

      - name: Render video
        env:
          PIPER_DIR: ${{ github.workspace }}/piper-runtime
          PIPER_EXE: ${{ github.workspace }}/piper-runtime/piper/piper
          PAYLOAD_B64: ${{ inputs.payload }}
        run: |
          echo "$PAYLOAD_B64" | base64 -d > payload.json
          python render_job.py payload.json

      - name: Publish MP4 to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: render-${{ inputs.job_id }}
          name: Render ${{ inputs.job_id }}
          body_path: out/meta.json
          files: |
            out/video.mp4
            out/subtitles.srt
            out/poster.png
            out/scene-*.mp4
          fail_on_unmatched_files: false
