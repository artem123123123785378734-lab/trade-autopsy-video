name: Render

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Public job id"
        required: true
        type: string
      payload:
        description: "Base64-encoded render payload"
        required: true
        type: string

run-name: Render ${{ inputs.job_id }}

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      # Playwright's Python image already includes libGL/EGL/GLES and the
      # common media libraries. Avoid apt mirrors entirely.
      image: mcr.microsoft.com/playwright/python:v1.49.1-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure FFmpeg
        run: |
          # imageio-ffmpeg ships a static binary with libx264. This avoids
          # apt mirrors that can hang on GitHub-hosted runners.
          FFMPEG_BIN="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          echo "FFMPEG=$FFMPEG_BIN" >> "$GITHUB_ENV"
          "$FFMPEG_BIN" -hide_banner -version | head -n 1

      - name: Verify Skia graphics libraries
        run: |
          python - <<'PY'
          import skia
          surface = skia.Surface(64, 64)
          surface.getCanvas().clear(skia.ColorBLACK)
          print("skia ok")
          PY

      - name: Install offline Piper voice
        run: |
          python - <<'PY'
          import time
          import urllib.request
          from pathlib import Path

          def get(url, path):
              path = Path(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              for attempt in range(5):
                  try:
                      urllib.request.urlretrieve(url, path)
                      if path.stat().st_size > 1000:
                          return
                  except Exception as exc:
                      print("retry", url, exc, flush=True)
                      time.sleep(3 + attempt * 2)
              raise SystemExit("download failed: " + url)

          get("https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz",
              "/tmp/piper.tgz")
          # Pin the voice revision: the current `main` JSON contains multi-codepoint
          # diphthongs (aɪ/aʊ/…) that the MIT-licensed Piper 2023.11 binary rejects.
          # This revision uses a single-codepoint phoneme map and works with it.
          voices = {
              "dmitri": "e7229f7d33a10e145e109b886d661984201ac3c4",
              "denis": "e7229f7d33a10e145e109b886d661984201ac3c4",
          }
          for voice, rev in voices.items():
              base = f"https://huggingface.co/rhasspy/piper-voices/resolve/{rev}/ru/ru_RU/{voice}/medium"
              get(f"{base}/ru_RU-{voice}-medium.onnx", f"piper-runtime/ru_RU-{voice}-medium.onnx")
              get(f"{base}/ru_RU-{voice}-medium.onnx.json", f"piper-runtime/ru_RU-{voice}-medium.onnx.json")
          PY
          tar -xzf /tmp/piper.tgz -C piper-runtime
          chmod +x piper-runtime/piper/piper

      - name: Render video
        env:
          PIPER_DIR: ${{ github.workspace }}/piper-runtime
          PIPER_EXE: ${{ github.workspace }}/piper-runtime/piper/piper
          PAYLOAD_B64: ${{ inputs.payload }}
        run: |
          echo "$PAYLOAD_B64" | base64 -d > payload.json
          python render_job.py payload.json

      - name: Publish MP4 to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: render-${{ inputs.job_id }}
          name: Render ${{ inputs.job_id }}
          body_path: out/meta.json
          files: |
            out/video.mp4
            out/subtitles.srt
            out/poster.png
            out/scene-*.mp4
          fail_on_unmatched_files: false
