name: Render

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Public job id"
        required: true
        type: string
      payload:
        description: "Base64-encoded render payload"
        required: true
        type: string

run-name: Render ${{ inputs.job_id }}

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Render video
        env:
          PAYLOAD_B64: ${{ inputs.payload }}
        run: |
          echo "$PAYLOAD_B64" | base64 -d > payload.json
          python render_job.py payload.json

      - name: Publish MP4 to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: render-${{ inputs.job_id }}
          name: Render ${{ inputs.job_id }}
          body_path: out/meta.json
          files: |
            out/video.mp4
            out/subtitles.srt
            out/poster.png
          fail_on_unmatched_files: true
